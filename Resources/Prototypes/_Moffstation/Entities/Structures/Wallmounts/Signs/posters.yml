  components:
    - type: Sprite
      state: poster_arnolds_pizza_hiring
    - type: DetailExaminable
      content: "Terms and conditions for applications apply."

- type: entity
  parent: PosterBaseMoff
  id: PosterArnoldsPizzaMissing
  name: "Missing Wawa"
  description: "Have you seen this Wawa?"
  components:
    - type: Sprite
      state: poster_arnolds_pizza_missing
    - type: DetailExaminable
      content: "Last seen by Arnold's Pizza."
