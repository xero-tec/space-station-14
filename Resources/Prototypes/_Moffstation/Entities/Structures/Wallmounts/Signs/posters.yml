- type: entity
  parent: PosterBase
  id: PosterBaseMoff
  suffix: Moff
  abstract: true
  components:
    - type: Sprite
      drawdepth: WallMountedItems
      sprite: _Moffstation/Structures/Wallmounts/moffposters.rsi
      snapCardinals: true

- type: entity
  parent: PosterBaseMoff
  id: PosterArnoldsPizzaAdvertisement
  name: "Arnold's Pizza"
  description: "A poster for advertising Arnold's Pizza, delivered by their dedicated team of Wawas!"
  components:
    - type: Sprite
      state: poster_arnolds_pizza_advertisement
    - type: DetailExaminable
      content: "The tagline reads: \"If you like pepperoni and bullets, you've come to the right place.\""

- type: entity
  parent: PosterBaseMoff
  id: PosterArnoldsPizzaHiring
